<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">{{ title }}</div>
      <nav>
        <a class="nav-item {{ 'active' if active=='jobs' else '' }}" href="{{ url_for('jobs_view') }}">
          <span class="ic">🗂️</span> Jobs
        </a>
        <a class="nav-item {{ 'active' if active=='saved' else '' }}" href="{{ url_for('saved_view') }}">
          <span class="ic">🔖</span> Saved
          {% if summary and summary.saved %}<span class="dot"></span>{% endif %}
        </a>
        <a class="nav-item {{ 'active' if active=='insights' else '' }}" href="{{ url_for('insights_view') }}">
          <span class="ic">📈</span> Insights
        </a>
      </nav>
      <div class="sidebar-foot">
        <div class="profile-chip">profile: <b>{{ profile }}</b></div>
        <div class="stat-mini">{{ summary.total_jobs }} jobs · {{ summary.early_apply }} early</div>
      </div>
    </aside>
    <main class="content">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
